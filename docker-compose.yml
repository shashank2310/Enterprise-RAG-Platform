services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=enterprise_rag;Username=rag_app;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
      AzureAd__TenantId: ${API_ENTRA_TENANT_ID:-organizations}
      AzureAd__ClientId: ${API_ENTRA_CLIENT_ID:-00000000-0000-0000-0000-000000000000}
      LocalDemo__Enabled: ${LOCAL_DEMO_AUTH:-true}
      Rag__Provider: Ollama
      Rag__EnableLocalPostgresIndex: "true"
      Ollama__BaseUrl: http://host.docker.internal:11434
      Ollama__ChatModel: ${OLLAMA_CHAT_MODEL:-qwen3:1.7b}
      Ollama__EmbeddingModel: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    ports:
      - "127.0.0.1:5283:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5283}
        VITE_ENTRA_CLIENT_ID: ${VITE_ENTRA_CLIENT_ID:-}
        VITE_ENTRA_TENANT_ID: ${VITE_ENTRA_TENANT_ID:-}
        VITE_ENTRA_API_SCOPE: ${VITE_ENTRA_API_SCOPE:-}
        VITE_LOCAL_DEMO_AUTH: ${LOCAL_DEMO_AUTH:-true}
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: enterprise_rag
      POSTGRES_USER: rag_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_app -d enterprise_rag"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
